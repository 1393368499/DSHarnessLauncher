[package]
name = "dsharness"
version = "4.0.1"
description = "DSHarness native desktop workbench"
authors = ["DSHarness"]
edition = "2021"

[lib]
name = "dsharness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
